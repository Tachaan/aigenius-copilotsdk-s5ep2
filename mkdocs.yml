site_name: AI Genius S5E2 — Agent HQ デモ
site_description: >-
  GitHub Copilot SDK を使用して小売分析アシスタントを構築するための
  ハンズオンラボ、コード解説、リファレンス資料です。
site_author: Vic Perdana
repo_url: https://github.com/vicperdana/aigenius-copilotsdk-s5ep2
repo_name: vicperdana/aigenius-copilotsdk-s5ep2
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: ja
  icon:
    repo: fontawesome/brands/github
  palette:
    # Follows the OS preference, with a manual toggle either way.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: ライトモードに切り替え
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: システム設定に合わせる
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  # Required so ```mermaid blocks render as diagrams rather than code.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

# docs/README.md is the GitHub-facing index for the docs folder; on the site
# that role is taken by index.md (generated from the root README), so exclude
# it to avoid a conflicting URL. Section READMEs are kept and used as their
# section landing pages.
exclude_docs: |
  /README.md
  /requirements.txt

hooks:
  - scripts/build_index.py

# Grouped by track, not by content type: .NET and Python are behavioural
# mirrors of each other and belong at the same level. Section README.md files
# are attached as section index pages (the navigation.indexes feature), so
# clicking a section header opens its overview.
nav:
  - ホーム: index.md
  - .NET:
      - ラボ:
          - labs/README.md
          - 01 — セットアップ: labs/01-setup/README.md
          - 02 — 最初のチャット: labs/02-first-chat/README.md
          - 03 — ツール: labs/03-tools/README.md
          - 04 — イベント: labs/04-events/README.md
          - 05 — セッション: labs/05-sessions/README.md
          - 06 — MCP: labs/06-mcp/README.md
          - 07 — まとめ: labs/07-wrap-up/README.md
          - 追加 — API の拡張: labs/extra-extend-api/README.md
      - デモ:
          - demos/README.md
          - 01 — Copilot SDK の統合: demos/01-copilot-sdk-integration.md
          - 02 — SSE ストリーミング: demos/02-sse-streaming.md
          - 03 — 小売分析: demos/03-retail-analytics.md
          - 04 — Blazor UI: demos/04-blazor-ui.md
  - Python:
      - ラボ:
          - labs-python/README.md
          - 01 — セットアップ: labs-python/01-setup/README.md
          - 02 — 最初のチャット: labs-python/02-first-chat/README.md
          - 03 — ツール: labs-python/03-tools/README.md
          - 04 — イベント: labs-python/04-events/README.md
          - 05 — セッション: labs-python/05-sessions/README.md
          - 06 — MCP: labs-python/06-mcp/README.md
          - 07 — まとめ: labs-python/07-wrap-up/README.md
          - 追加 — API の拡張: labs-python/extra-extend-api/README.md
      - デモ:
          - demos-python/README.md
          - 01 — Copilot SDK の統合: demos-python/01-copilot-sdk-integration.md
          - 02 — SSE ストリーミング: demos-python/02-sse-streaming.md
          - 03 — 小売分析: demos-python/03-retail-analytics.md
          - 04 — Web UI: demos-python/04-web-ui.md
  # Track-agnostic material: reference pages and the two Copilot CLI labs that
  # apply to both tracks.
  - 補足資料:
      - breakouts/README.md
      - リファレンス:
          - アーキテクチャ: breakouts/architecture.md
          - カスタムエージェント: breakouts/custom-agents.md
          - フックとガバナンス: breakouts/hooks-and-governance.md
          - スキル: breakouts/skills.md
          - トラブルシューティング: breakouts/troubleshooting.md
      - 追加ハンズオン:
          - カスタムエージェント: labs/extra-custom-agents/README.md
          - ガバナンスフック: labs/extra-governance-hooks/README.md
  # Interactive system diagram. The HTML beside it is generated output; the
  # typed JSON source next to it is what you edit.
  - システムマップ:
      - system-map/README.md
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vicperdana/aigenius-copilotsdk-s5ep2
      name: リポジトリ

copyright: >-
  コードは MIT ライセンス、ドキュメントは CC BY 4.0 ライセンスで提供
