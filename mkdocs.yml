site_name: AI Genius S5E2 — Agent HQ Demo
site_description: >-
  Build a retail analytics assistant with the GitHub Copilot SDK — hands-on
  labs, code walkthroughs, and reference material.
site_author: Vic Perdana
repo_url: https://github.com/vicperdana/aigenius-copilotsdk-s5ep2
repo_name: vicperdana/aigenius-copilotsdk-s5ep2
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    # Follows the OS preference, with a manual toggle either way.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  # Required so ```mermaid blocks render as diagrams rather than code.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

# docs/README.md is the GitHub-facing index for the docs folder; on the site
# that role is taken by index.md (generated from the root README), so exclude
# it to avoid a conflicting URL. Section READMEs are kept and used as their
# section landing pages.
exclude_docs: |
  /README.md
  /requirements.txt

hooks:
  - scripts/build_index.py

# Grouped by track, not by content type: .NET and Python are behavioural
# mirrors of each other and belong at the same level. Section README.md files
# are attached as section index pages (the navigation.indexes feature), so
# clicking a section header opens its overview.
nav:
  - Home: index.md
  - .NET:
      - Labs:
          - labs/README.md
          - 01 — Setup: labs/01-setup/README.md
          - 02 — First chat: labs/02-first-chat/README.md
          - 03 — Tools: labs/03-tools/README.md
          - 04 — Events: labs/04-events/README.md
          - 05 — Sessions: labs/05-sessions/README.md
          - 06 — MCP: labs/06-mcp/README.md
          - 07 — Wrap-up: labs/07-wrap-up/README.md
          - Extra — Extend the API: labs/extra-extend-api/README.md
      - Demos:
          - demos/README.md
          - 01 — Copilot SDK integration: demos/01-copilot-sdk-integration.md
          - 02 — SSE streaming: demos/02-sse-streaming.md
          - 03 — Retail analytics: demos/03-retail-analytics.md
          - 04 — Blazor UI: demos/04-blazor-ui.md
  - Python:
      - Labs:
          - labs-python/README.md
          - 01 — Setup: labs-python/01-setup/README.md
          - 02 — First chat: labs-python/02-first-chat/README.md
          - 03 — Tools: labs-python/03-tools/README.md
          - 04 — Events: labs-python/04-events/README.md
          - 05 — Sessions: labs-python/05-sessions/README.md
          - 06 — MCP: labs-python/06-mcp/README.md
          - 07 — Wrap-up: labs-python/07-wrap-up/README.md
          - Extra — Extend the API: labs-python/extra-extend-api/README.md
      - Demos:
          - demos-python/README.md
          - 01 — Copilot SDK integration: demos-python/01-copilot-sdk-integration.md
          - 02 — SSE streaming: demos-python/02-sse-streaming.md
          - 03 — Retail analytics: demos-python/03-retail-analytics.md
          - 04 — Web UI: demos-python/04-web-ui.md
  # Track-agnostic material: reference pages, the two Copilot CLI labs that
  # apply to both tracks, and the presenter talk track.
  - Breakouts:
      - breakouts/README.md
      - Reference:
          - Architecture: breakouts/architecture.md
          - Custom agents: breakouts/custom-agents.md
          - Hooks and governance: breakouts/hooks-and-governance.md
          - Skills: breakouts/skills.md
          - Troubleshooting: breakouts/troubleshooting.md
      - Hands-on extras:
          - Custom agents: labs/extra-custom-agents/README.md
          - Governance hooks: labs/extra-governance-hooks/README.md
      - Presenting:
          - Demo script: demos/demo-script.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vicperdana/aigenius-copilotsdk-s5ep2
      name: Repository

copyright: >-
  Code licensed under MIT · Documentation licensed under CC BY 4.0
