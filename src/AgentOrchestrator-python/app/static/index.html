<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retail Analytics Assistant (Python)</title>

    <!-- Syntax highlighting - both themes, one is disabled at runtime -->
    <link id="hljs-dark" rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
    <link id="hljs-light" rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" disabled />

    <link rel="stylesheet" href="app.css" />
</head>

<body>
    <div class="chat-app dark" id="chat-app">
        <header class="header">
            <div class="header-left">
                <h1>📊 Retail Analytics Assistant</h1>
                <span class="badge">Copilot SDK Demo · Python</span>
            </div>
            <div class="header-right">
                <label for="model-select">Model:</label>
                <select id="model-select"></select>
                <button class="btn-clear" id="btn-clear" title="Clear conversation">🗑️ Clear</button>
                <button class="btn-theme" id="btn-theme" title="Toggle theme">🌙</button>
            </div>
        </header>

        <main class="chat-main">
            <div class="messages-container" id="messages-container">
                <div class="welcome" id="welcome">
                    <h2>Retail Analytics Assistant</h2>
                    <p>Ask about customer spending patterns, segment performance, and retail insights.</p>
                    <div class="suggestions" id="suggestions"></div>
                </div>
            </div>

            <div class="chat-input-container">
                <textarea id="chat-input" rows="1"
                    placeholder="Ask about customers, segments, or retail trends..."></textarea>
                <button class="send-btn" id="send-btn" disabled><span>➤</span></button>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/csharp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
