name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore src/AgentOrchestrator/AgentHQDemo.slnx
      
      - name: Build
        run: dotnet build src/AgentOrchestrator/AgentHQDemo.slnx --no-restore --configuration Release
      
      - name: Test
        run: dotnet test src/AgentOrchestrator/AgentHQDemo.slnx --no-build --configuration Release --verbosity normal --logger trx --results-directory "TestResults"
      
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults
          retention-days: 5

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore src/AgentOrchestrator/AgentHQDemo.slnx
      
      - name: Check formatting
        run: dotnet format src/AgentOrchestrator/AgentHQDemo.slnx --verify-no-changes --verbosity diagnostic
        continue-on-error: true

  python:
    name: Python (build, lint, test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    defaults:
      run:
        working-directory: src/AgentOrchestrator-python

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: src/AgentOrchestrator-python/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q
