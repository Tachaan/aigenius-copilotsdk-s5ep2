name: Public release guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  guard:
    name: Public release guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan reachable history without exposing matches
        run: gitleaks git --log-opts="--all --full-history" --redact --no-banner --max-decode-depth=2 --max-archive-depth=2 .

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test artifact guard
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Test release configuration without remote mutations
        shell: pwsh
        run: ./scripts/test_public_release.ps1
